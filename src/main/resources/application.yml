spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/bitlab_news}
    username: ${DB_USER:news_user}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  error:
    include-message: never
    include-stacktrace: never